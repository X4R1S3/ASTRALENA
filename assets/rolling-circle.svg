<svg xmlns="http://www.w3.org/2000/svg" width="520" height="520" viewBox="0 0 520 520" role="img" aria-labelledby="title desc">
  <title id="title">Astronaut drifting through deep space above Earth</title>
  <desc id="desc">A complete circular deep-space background with stars, colorful nebulae, Earth's atmosphere, and a gently floating astronaut.</desc>
  <defs>
    <radialGradient id="deepSpace" cx="48%" cy="38%" r="75%">
      <stop stop-color="#263d91"/><stop offset=".32" stop-color="#111f5b"/><stop offset=".7" stop-color="#070d2c"/><stop offset="1" stop-color="#01030d"/>
    </radialGradient>
    <linearGradient id="earthGlow" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b6ffff"/><stop offset=".35" stop-color="#2ab9ec"/><stop offset="1" stop-color="#071a62"/></linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".55" stop-color="#d8f6ff"/><stop offset="1" stop-color="#6684ca"/></linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9ffff"/><stop offset=".4" stop-color="#4bdfff"/><stop offset="1" stop-color="#1d388d"/></linearGradient>
    <linearGradient id="nebulaPink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff5dbb" stop-opacity=".45"/><stop offset="1" stop-color="#7f39ff" stop-opacity="0"/></linearGradient>
    <linearGradient id="nebulaBlue" x1="1" y1="0" x2="0" y2="1"><stop stop-color="#37e8ff" stop-opacity=".38"/><stop offset="1" stop-color="#3560ff" stop-opacity="0"/></linearGradient>
    <filter id="blur20" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="blur8" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="circle"><circle cx="260" cy="260" r="247"/></clipPath>
  </defs>

  <g clip-path="url(#circle)">
