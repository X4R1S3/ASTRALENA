<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Astralena orbital shuttle</title>
  <desc id="desc">A small shuttle travels around a glowing orbital ring in deep space.</desc>
  <defs>
    <radialGradient id="space" cx="50%" cy="45%" r="72%">
      <stop offset="0" stop-color="#101B46"/>
      <stop offset="0.62" stop-color="#050A22"/>
      <stop offset="1" stop-color="#01020A"/>
    </radialGradient>
    <radialGradient id="nebula" cx="34%" cy="30%" r="60%">
      <stop offset="0" stop-color="#6B4DFF" stop-opacity="0.38"/>
      <stop offset="0.48" stop-color="#245BFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#245BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbit" x1="12" y1="100" x2="228" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6D5CFF" stop-opacity="0.2"/>
      <stop offset="0.45" stop-color="#86F7FF"/>
      <stop offset="1" stop-color="#5D72FF" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="hull" x1="-12" y1="-8" x2="13" y2="11" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7FDFF"/>
      <stop offset="0.55" stop-color="#B8D9FF"/>
      <stop offset="1" stop-color="#6D8DDB"/>
    </linearGradient>
    <linearGradient id="engine" x1="-14" y1="0" x2="-25" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B5FFFF"/>
      <stop offset="0.5" stop-color="#3CE8FF"/>
      <stop offset="1" stop-color="#6D5CFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>
    <clipPath id="frame"><circle cx="120" cy="120" r="117"/></clipPath>
    <path id="orbitPath" d="M 25 120 A 95 49 0 1 0 215 120 A 95 49 0 1 0 25 120" fill="none"/>
  </defs>

  <g clip-path="url(#frame)">
    <circle cx="120" cy="120" r="118" fill="url(#space)"/>
    <circle cx="120" cy="120" r="118" fill="url(#nebula)"/>

    <g fill="#E8F5FF">
      <circle cx="27" cy="39" r="1.1" opacity="0.8"/>
      <circle cx="57" cy="18" r="0.7" opacity="0.65"/>
      <circle cx="87" cy="42" r="1.2" opacity="0.9"/>
      <circle cx="185" cy="25" r="0.8" opacity="0.7"/>
      <circle cx="215" cy="59" r="1.1" opacity="0.75"/>
      <circle cx="18" cy="135" r="0.8" opacity="0.6"/>
      <circle cx="43" cy="201" r="1.2" opacity="0.8"/>
      <circle cx="85" cy="218" r="0.7" opacity="0.65"/>
      <circle cx="160" cy="207" r="1" opacity="0.8"/>
      <circle cx="221" cy="180" r="0.7" opacity="0.7"/>
      <circle cx="196" cy="135" r="0.9" opacity="0.85"/>
    </g>

    <ellipse cx="120" cy="120" rx="95" ry="49" fill="none" stroke="#142A62" stroke-width="7" opacity="0.55" filter="url(#soft)"/>
    <ellipse cx="120" cy="120" rx="95" ry="49" fill="none" stroke="url(#orbit)" stroke-width="2" opacity="0.95"/>
    <ellipse cx="120" cy="120" rx="67" ry="34" fill="none" stroke="#47DDF4" stroke-width="1" opacity="0.22"/>

    <circle cx="120" cy="120" r="27" fill="#071331" stroke="#4077D9" stroke-width="1.5" opacity="0.95"/>
    <circle cx="120" cy="120" r="19" fill="none" stroke="#6EF3FF" stroke-width="1" opacity="0.42"/>
    <path d="M120 96v48M96 120h48" stroke="#6EF3FF" stroke-width="1" opacity="0.18"/>
    <circle cx="120" cy="120" r="5" fill="#9FFFFF" filter="url(#glow)"/>
    <circle cx="120" cy="120" r="2" fill="#FFFFFF"/>

    <g>
      <animateMotion dur="6s" repeatCount="indefinite" rotate="auto">
        <mpath href="#orbitPath"/>
      </animateMotion>
      <g transform="rotate(0)">
        <path d="M -29 0 C -24 -4 -19 -5 -12 -5 L 11 -5 L 19 0 L 11 5 L -12 5 C -19 5 -24 4 -29 0 Z" fill="url(#hull)" stroke="#D6F8FF" stroke-width="0.8"/>
        <path d="M 1 -4 L 8 -1 L 8 2 L 1 4 Z" fill="#243F92"/>
        <path d="M -7 -5 L -16 -13 L -12 -4 Z" fill="#4A6FCC" stroke="#AEDCFF" stroke-width="0.6"/>
        <path d="M -7 5 L -16 13 L -12 4 Z" fill="#4A6FCC" stroke="#AEDCFF" stroke-width="0.6"/>
        <path d="M 11 -4 L 16 -9 L 14 -2 Z" fill="#6D8FFF"/>
        <path d="M 11 4 L 16 9 L 14 2 Z" fill="#6D8FFF"/>
        <path d="M -27 0 L -43 0" stroke="url(#engine)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
        <circle cx="5" cy="-1.6" r="1" fill="#6EFFFF"/>
      </g>
    </g>

    <path d="M 25 120 A 95 49 0 0 1 72 78" fill="none" stroke="#B3FFFF" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    <circle cx="72" cy="78" r="2" fill="#B3FFFF" filter="url(#glow)"/>
    <circle cx="120" cy="120" r="117" fill="none" stroke="#2E55C9" stroke-width="2" opacity="0.55"/>
  </g>
</svg>
