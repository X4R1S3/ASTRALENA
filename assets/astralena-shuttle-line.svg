<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" role="img" aria-labelledby="title desc">
  <title id="title">ASTRALENA AI shuttle line</title>
  <desc id="desc">A shuttle flies across a space-colored ASTRALENA AI line with two blue smoke trails and loops forever.</desc>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#030719"/><stop offset=".5" stop-color="#101e52"/><stop offset="1" stop-color="#030719"/></linearGradient>
    <linearGradient id="letters" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#65f5ff"/><stop offset=".45" stop-color="#b99cff"/><stop offset="1" stop-color="#ff66c4"/></linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset=".5" stop-color="#b8eeff"/><stop offset="1" stop-color="#5678c9"/></linearGradient>
    <linearGradient id="smoke" x1="1" y1="0" x2="0" y2="0"><stop stop-color="#7cf5ff" stop-opacity=".95"/><stop offset=".55" stop-color="#267bff" stop-opacity=".58"/><stop offset="1" stop-color="#3150ff" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="2"/></filter>
    <clipPath id="bar"><rect x="8" y="18" width="984" height="114" rx="57"/></clipPath>
  </defs>
  <rect x="8" y="18" width="984" height="114" rx="57" fill="url(#space)" stroke="#5b8eff" stroke-width="2"/>
  <g clip-path="url(#bar)">
    <g fill="#e8ffff" opacity=".75"><circle cx="46" cy="48" r="1"/><circle cx="121" cy="108" r="1.2"/><circle cx="214" cy="42" r="1"/><circle cx="788" cy="45" r="1.2"/><circle cx="905" cy="104" r="1"/><circle cx="962" cy="58" r="1.2"/></g>
    <path d="M70 75H930" stroke="#4d8cff" stroke-width="1" stroke-dasharray="3 12" opacity=".55"/>
    <text x="500" y="91" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" letter-spacing="8" fill="url(#letters)" filter="url(#glow)">ASTRALENA AI</text>
    <g>
      <animateTransform attributeName="transform" type="translate" values="-155 0; 1080 0" dur="9s" repeatCount="indefinite"/>
      <g transform="translate(0 0)">
        <path d="M55 66C28 52 2 57-30 68C3 72 31 80 57 76Z" fill="url(#smoke)" filter="url(#soft)"/>
        <path d="M54 82C27 82 7 94-20 112C15 105 39 100 62 91Z" fill="url(#smoke)" filter="url(#soft)"/>
        <path d="M66 74H13" stroke="#80f7ff" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
        <path d="M70 74L51 57L54 74L51 91Z" fill="url(#hull)" stroke="#efffff" stroke-width="2"/>
        <path d="M56 69L32 47L38 70ZM56 79L32 101L38 78Z" fill="#5577c7" stroke="#bff5ff" stroke-width="1.5"/>
        <path d="M62 70L80 72L87 75L80 78L62 80Z" fill="#dffbff"/>
        <circle cx="72" cy="74" r="4" fill="#4beaff"/>
        <path d="M50 72L42 74L50 76" fill="#173d91"/>
      </g>
    </g>
  </g>
  <path d="M82 131H918" stroke="#77ecff" stroke-width="1" opacity=".35"/>
</svg>
