<svg xmlns="http://www.w3.org/2000/svg" width="460" height="460" viewBox="0 0 460 460" role="img" aria-labelledby="title desc">
  <title id="title">Astronaut floating around Earth</title>
  <desc id="desc">A lone astronaut drifts endlessly around a glowing Earth inside a circular outer-space scene.</desc>
  <defs>
    <radialGradient id="space" cx="42%" cy="35%" r="75%">
      <stop stop-color="#263a82"/><stop offset=".45" stop-color="#0d1a4a"/><stop offset="1" stop-color="#020512"/>
    </radialGradient>
    <radialGradient id="earth" cx="32%" cy="24%" r="76%">
      <stop stop-color="#6beaff"/><stop offset=".35" stop-color="#217bd0"/><stop offset=".76" stop-color="#0a317b"/><stop offset="1" stop-color="#03102f"/>
    </radialGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".55" stop-color="#d8f6ff"/><stop offset="1" stop-color="#7194db"/></linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e4ffff"/><stop offset=".45" stop-color="#47dfff"/><stop offset="1" stop-color="#214696"/></linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b8f28c"/><stop offset="1" stop-color="#19846b"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="round"><circle cx="230" cy="230" r="220"/></clipPath>
    <path id="drift" d="M 85 234 C 103 119 193 74 290 89 C 386 104 404 185 369 274 C 329 376 223 386 135 329 C 87 298 71 269 85 234"/>
  </defs>

  <g clip-path="url(#round)">
    <circle cx="230" cy="230" r="220" fill="url(#space)"/>
    <ellipse cx="118" cy="107" rx="155" ry="108" fill="#6d59ff" opacity=".16" filter="url(#glow)"/>
    <ellipse cx="370" cy="354" rx="180" ry="108" fill="#00dfff" opacity=".12" filter="url(#glow)"/>

    <g fill="#efffff">
      <circle cx="57" cy="112" r="2"/><circle cx="102" cy="54" r="1.3" opacity=".7"/><circle cx="180" cy="82" r="1.5" opacity=".8"/>
      <circle cx="294" cy="53" r="1.8"/><circle cx="390" cy="94" r="1.4" opacity=".75"/><circle cx="415" cy="174" r="2"/>
      <circle cx="57" cy="316" r="1.5" opacity=".75"/><circle cx="112" cy="397" r="1.8"/><circle cx="204" cy="412" r="1.2"/>
      <circle cx="326" cy="397" r="1.7" opacity=".8"/><circle cx="404" cy="326" r="1.5"/><circle cx="370" cy="210" r="1.3" opacity=".7"/>
    </g>
    <g fill="#76f4ff" filter="url(#soft)"><circle cx="146" cy="142" r="1.7"/><circle cx="350" cy="139" r="1.6"/><circle cx="91" cy="274" r="1.6"/><circle cx="349" cy="348" r="1.5"/></g>

    <ellipse cx="230" cy="230" rx="151" ry="92" fill="none" stroke="#5f8dff" stroke-width="18" opacity=".18" filter="url(#glow)"/>
    <ellipse cx="230" cy="230" rx="151" ry="92" fill="none" stroke="#81adff" stroke-width="2" stroke-dasharray="4 11" opacity=".75"/>
    <ellipse cx="230" cy="230" rx="145" ry="87" fill="none" stroke="#b3ffff" stroke-width="1" opacity=".75"/>

    <circle cx="230" cy="230" r="94" fill="#5ae7ff" opacity=".14" filter="url(#glow)"/>
    <circle cx="230" cy="230" r="73" fill="url(#earth)" stroke="#b5ffff" stroke-width="2"/>
    <path d="M181 201c12-20 34-26 50-15 13 9 11 24-4 31-14 7-17 22-34 18-16-3-19-19-12-34Z" fill="url(#land)"/>
    <path d="M253 181c20-5 38 5 45 20 5 12-4 22-17 20-12-2-17 13-29 9-13-5-16-23-8-33 4-5 5-12 9-16Z" fill="url(#land)"/>
    <path d="M252 250c18-13 39-8 46 7 7 13-3 25-17 26-15 0-22 16-36 9-13-7-13-23-4-33 4-4 7-7 11-9Z" fill="url(#land)"/>
    <path d="M177 259c13-8 30-3 34 8 4 10-5 18-16 17-13-1-20-10-18-25Z" fill="url(#land)"/>
    <ellipse cx="230" cy="230" rx="70" ry="22" fill="none" stroke="#baffff" stroke-width="2" opacity=".35" transform="rotate(-25 230 230)"/>
    <path d="M160 230a70 70 0 0 0 140 0" fill="none" stroke="#d2ffff" stroke-width="3" opacity=".6"/>

    <g>
      <animateMotion dur="13s" repeatCount="indefinite" rotate="auto"><mpath href="#drift"/></animateMotion>
      <g transform="scale(.76)">
        <path d="M-40 2h-31" stroke="#68f0ff" stroke-width="4" stroke-linecap="round" filter="url(#soft)"/>
        <path d="M-28-11h17v34h-17z" rx="7" fill="#5e7fc6" stroke="#c9f8ff" stroke-width="2"/>
        <path d="M-17-6-40-29-33 0ZM-17 18-40 40-33 14Z" fill="#526fb8" stroke="#c5f7ff" stroke-width="1.5"/>
        <rect x="-17" y="-24" width="43" height="51" rx="17" fill="url(#suit)" stroke="#efffff" stroke-width="2"/>
        <circle cx="5" cy="-38" r="23" fill="url(#suit)" stroke="#d9ffff" stroke-width="2"/>
        <rect x="-12" y="-50" width="34" height="23" rx="10" fill="url(#visor)" stroke="#f2ffff" stroke-width="1.5"/>
        <path d="M-8-2-39 17M24-2 53-22" stroke="#e1f9ff" stroke-width="10" stroke-linecap="round"/>
        <circle cx="-43" cy="20" r="5" fill="#70efff"/><circle cx="57" cy="-25" r="5" fill="#70efff"/>
        <path d="M-6 25-14 49M15 25 26 48" stroke="#e1f9ff" stroke-width="11" stroke-linecap="round"/>
        <path d="M-22 52h16M18 51h16" stroke="#5a79c6" stroke-width="7" stroke-linecap="round"/>
        <rect x="-3" y="-4" width="15" height="13" rx="3" fill="#143671" stroke="#75f5ff" stroke-width="1.5"/>
      </g>
    </g>
    <circle cx="230" cy="230" r="220" fill="none" stroke="#6b96ea" stroke-width="4" opacity=".75"/>
    <circle cx="230" cy="230" r="213" fill="none" stroke="#b0f5ff" stroke-width="1" opacity=".2"/>
  </g>
</svg>
